services:
  - type: web
    name: resqfood-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python -m backend.seed
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resqfood-db
          property: connectionString

databases:
  - name: resqfood-db
    plan: free
